name: Check page scripts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check inline JavaScript
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("index.html", "utf8");
          const scripts = [...html.matchAll(/<script\\b([^>]*)>([\\s\\S]*?)<\\/script>/gi)];
          if (scripts.length === 0) throw new Error("No inline scripts found.");
          scripts.forEach((match, index) => {
            const isModule = /type=["']module["']/i.test(match[1]);
            const extension = isModule ? "mjs" : "js";
            fs.writeFileSync(`/tmp/page-script-${index}.${extension}`, match[2]);
          });
          NODE
          for file in /tmp/page-script-*.js /tmp/page-script-*.mjs; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
